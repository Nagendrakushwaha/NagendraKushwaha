<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080e21" />
      <stop offset="100%" stop-color="#060a17" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f7fa" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="nodeLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 14.5px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient background glow circles -->
  <circle cx="200" cy="80" r="180" fill="#00f2fe" opacity="0.04" filter="url(#glow)" />
  <circle cx="1020" cy="240" r="220" fill="#7000ff" opacity="0.06" filter="url(#glow)" />
  <circle cx="600" cy="170" r="140" fill="#38bdf8" opacity="0.03" filter="url(#glow)" />

  <!-- Grid overlay -->
  <rect width="1200" height="340" rx="16" fill="url(#cyberGrid)" />

  <!-- Border & Neon Accent -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="80" y1="1" x2="400" y2="1" stroke="url(#cyanBlue)" stroke-width="2.5" />
  <line x1="800" y1="339" x2="1120" y2="339" stroke="url(#cyanBlue)" stroke-width="2.5" />

  <!-- Neural Network Visual Mesh (Right Side Background) -->
  <g opacity="0.65">
    <!-- Synaptic Lines -->
    <line x1="900" y1="70" x2="980" y2="120" stroke="url(#nodeLineGrad)" stroke-width="1.2" />
    <line x1="980" y1="120" x2="1080" y2="90" stroke="url(#nodeLineGrad)" stroke-width="1" />
    <line x1="980" y1="120" x2="1020" y2="200" stroke="url(#nodeLineGrad)" stroke-width="1.4" />
    <line x1="1020" y1="200" x2="1130" y2="170" stroke="url(#nodeLineGrad)" stroke-width="1.2" />
    <line x1="900" y1="70" x2="880" y2="170" stroke="url(#nodeLineGrad)" stroke-width="1" />
    <line x1="880" y1="170" x2="1020" y2="200" stroke="url(#nodeLineGrad)" stroke-width="1.2" />
    <line x1="1020" y1="200" x2="960" y2="280" stroke="url(#nodeLineGrad)" stroke-width="1" />
    <line x1="960" y1="280" x2="1090" y2="270" stroke="url(#nodeLineGrad)" stroke-width="1.2" />
    <line x1="1130" y1="170" x2="1090" y2="270" stroke="url(#nodeLineGrad)" stroke-width="1.2" />
    <line x1="850" y1="240" x2="960" y2="280" stroke="url(#nodeLineGrad)" stroke-width="0.8" />
    <line x1="880" y1="170" x2="850" y2="240" stroke="url(#nodeLineGrad)" stroke-width="0.8" />

    <!-- Neural Nodes -->
    <circle cx="900" cy="70" r="3.5" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="980" cy="120" r="5" fill="#38bdf8" />
    <circle cx="1080" cy="90" r="4" fill="#818cf8" />
    <circle cx="1020" cy="200" r="6" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="1130" cy="170" r="4.5" fill="#a855f7" />
    <circle cx="880" cy="170" r="4" fill="#38bdf8" />
    <circle cx="960" cy="280" r="5" fill="#6366f1" />
    <circle cx="1090" cy="270" r="4" fill="#00f2fe" />
    <circle cx="850" cy="240" r="3" fill="#818cf8" />

    <!-- Pulse Rings on Key Anchor Node -->
    <circle cx="1020" cy="200" r="14" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" />
    <circle cx="980" cy="120" r="11" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.25" />
  </g>

  <!-- Left Side Geometric Accents -->
  <g opacity="0.4">
    <circle cx="60" cy="60" r="3" fill="#00f2fe" />
    <line x1="60" y1="60" x2="110" y2="60" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="60" y1="60" x2="60" y2="110" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  <!-- Main Content Block -->
  <g transform="translate(70, 0)">
    <!-- Top Status Pill -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="370" height="28" rx="14" fill="#0b172e" stroke="#1e3a5f" stroke-width="1" />
      <!-- Pulsing Green Online Indicator -->
      <circle cx="16" cy="14" r="4" fill="#10b981" />
      <circle cx="16" cy="14" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4" />
      <text x="32" y="18" fill="#38bdf8" class="badge-text">AI ENGINEER &amp; DATA SCIENTIST</text>
      <text x="268" y="18" fill="#64748b" class="badge-text">· BHOPAL, IN</text>
    </g>

    <!-- Candidate Name -->
    <text x="0" y="132" fill="url(#textGrad)" font-size="46" class="title-text">
      NAGENDRA KUSHWAHA
    </text>

    <!-- Subtitle / Disciplines -->
    <text x="0" y="172" fill="#94a3b8" font-size="16" class="subtitle-text">
      <tspan fill="#38bdf8">DATA SCIENCE</tspan>
      <tspan fill="#64748b"> · </tspan>
      <tspan fill="#818cf8">ARTIFICIAL INTELLIGENCE</tspan>
      <tspan fill="#64748b"> · </tspan>
      <tspan fill="#2dd4bf">MACHINE LEARNING</tspan>
      <tspan fill="#64748b"> · </tspan>
      <tspan fill="#c084fc">DEEP LEARNING</tspan>
    </text>

    <!-- Professional Core Statement -->
    <text x="0" y="214" fill="#cbd5e1" class="tagline-text">
      "Architecting robust intelligent systems — from rigorous exploratory analytics and feature engineering
    </text>
    <text x="0" y="236" fill="#cbd5e1" class="tagline-text">
      to deep neural networks, retrieval-augmented generation (RAG), and high-performance production APIs."
    </text>

    <!-- Specialty Badges Row -->
    <g transform="translate(0, 268)">
      <!-- Badge 1: Generative AI & RAG -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="26" rx="6" fill="#0b172e" stroke="#0284c7" stroke-width="1" />
        <text x="12" y="17" fill="#7dd3fc" class="badge-text">⚡ GENERATIVE AI / RAG</text>
      </g>

      <!-- Badge 2: Computer Vision -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="156" height="26" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
        <text x="12" y="17" fill="#a5b4fc" class="badge-text">👁️ COMPUTER VISION</text>
      </g>

      <!-- Badge 3: Predictive ML -->
      <g transform="translate(344, 0)">
        <rect x="0" y="0" width="176" height="26" rx="6" fill="#0c1a24" stroke="#0d9488" stroke-width="1" />
        <text x="12" y="17" fill="#5eead4" class="badge-text">📊 PREDICTIVE MODELING</text>
      </g>

      <!-- Badge 4: Production APIs -->
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="158" height="26" rx="6" fill="#18132b" stroke="#9333ea" stroke-width="1" />
        <text x="12" y="17" fill="#d8b4fe" class="badge-text">🚀 FASTAPI &amp; REACT</text>
      </g>
    </g>
  </g>
</svg>
